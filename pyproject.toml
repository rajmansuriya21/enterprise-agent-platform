[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "enterprise-agent-platform"
version = "1.0.0"
description = "Enterprise Multi-Agent Workflow & Document Intelligence Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Developer"},
]
keywords = ["langgraph", "langchain", "rag", "multi-agent", "fastapi", "qdrant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # === LLM & Agent Framework ===
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",

    # === Vector Store ===
    "qdrant-client>=1.9.0",

    # === API Framework ===
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # === Data Processing ===
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "beautifulsoup4>=4.12.0",

    # === Database ===
    "aiosqlite>=0.20.0",

    # === Cache ===
    "redis>=5.0.0",

    # === Numeric ===
    "numpy>=1.24.0",

    # === Observability ===
    "prometheus-client>=0.20.0",

    # === Configuration ===
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",

    # === HTTP Client ===
    "httpx>=0.27.0",

    # === Streamlit Frontend ===
    "streamlit>=1.30.0",
    "plotly>=5.18.0",

    # === Utilities ===
    "tenacity>=8.2.0",
    "structlog>=23.2.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "httpx>=0.27.0",
]

[project.scripts]
agent-api = "src.api.main:start_server"
seed-data = "scripts.seed_data:main"
benchmark = "scripts.benchmark:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
