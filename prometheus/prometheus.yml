# Prometheus configuration for Enterprise Agent Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'agent-platform-api'
    metrics_path: '/api/v1/metrics/prometheus'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'agent-api'

  - job_name: 'qdrant'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['qdrant:6333']
        labels:
          service: 'qdrant'
